[project]
name = "codegenx"
version = "0.1.0"
description = "CodeGenX backend monolith (gateway + user + app + ai services)"
requires-python = ">=3.12"
dependencies = [
    # Web Framework
    "fastapi>=0.113.0",
    "uvicorn[standard]>=0.23.0",
    "python-multipart>=0.0.9",
    # Data Validation
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    # Async & HTTP
    "httpx>=0.27.0",
    "aiofiles>=24.1.0",
    # Database
    "sqlalchemy[asyncio]>=2.0.30",
    "aiomysql>=0.2.0",
    "pymysql>=1.1.0",
    "greenlet>=3.0.0",
    "tzdata>=2024.1",
    # Cache
    "redis>=5.0.0",
    # Auth & Security
    "PyJWT>=2.9.0",
    "cryptography>=43.0.0",
    # Configuration
    "PyYAML>=6.0",
    "python-dotenv>=1.0.0",
    # Logging
    "loguru>=0.7.0",
    # LLM Client
    "openai>=1.50.0",
    # Monitoring
    "prometheus-client>=0.20.0",
    # Data Processing (ai-service data analysis tools)
    "numpy>=1.26.0",
    "pandas>=2.0.0",
    "chardet>=5.0.0",
    # Vector DB
    "qdrant-client>=1.11.0",
    # Other
    "requests>=2.32.0",
]

[project.scripts]
codegenx = "codegenx.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/codegenx", "src/shared", "src/infra"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
