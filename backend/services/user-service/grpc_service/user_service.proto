syntax = "proto3";

package user;

service UserService {
  rpc Register(RegisterRequest) returns (RegisterResponse);
  rpc Login(LoginRequest) returns (LoginResponse);
  rpc GetUser(GetUserRequest) returns (UserResponse);
  rpc AddUser(AddUserRequest) returns (AddUserResponse);
  rpc UpdateUser(UpdateUserRequest) returns (UpdateUserResponse);
  rpc DeleteUser(DeleteUserRequest) returns (DeleteUserResponse);
  rpc ListUsersPage(ListUsersPageRequest) returns (ListUsersPageResponse);
}

message RegisterRequest {
  string user_account = 1;
  string user_password = 2;
  string check_password = 3;
  optional string user_name = 4;
}

message RegisterResponse {
  int64 user_id = 1;
}

message LoginRequest {
  string user_account = 1;
  string user_password = 2;
}

message LoginResponse {
  User user = 1;
}

message GetUserRequest {
  int64 user_id = 1;
}

message User {
  int64 id = 1;
  string user_account = 2;
  string user_name = 3;
  string user_avatar = 4;
  string user_profile = 5;
  string user_role = 6;
}

message UserResponse {
  User user = 1;
}

message AddUserRequest {
  string user_account = 1;
  string user_password = 2;
  optional string user_name = 3;
  optional string user_avatar = 4;
  optional string user_profile = 5;
  optional string user_role = 6;
}

message AddUserResponse {
  int64 user_id = 1;
}

message UpdateUserRequest {
  int64 user_id = 1;
  optional string user_name = 2;
  optional string user_avatar = 3;
  optional string user_profile = 4;
  optional string user_role = 5;
}

message UpdateUserResponse {
  bool success = 1;
}

message DeleteUserRequest {
  int64 user_id = 1;
}

message DeleteUserResponse {
  bool success = 1;
}

message ListUsersPageRequest {
  int32 page_num = 1;
  int32 page_size = 2;
  optional int64 user_id = 3;
  optional string user_account = 4;
  optional string user_name = 5;
  optional string user_profile = 6;
  optional string user_role = 7;
  optional string sort_field = 8;
  optional string sort_order = 9;
}

message ListUsersPageResponse {
  PageData page_data = 1;
}

message PageData {
  repeated User records = 1;
  int32 page_number = 2;
  int32 page_size = 3;
  int32 total_page = 4;
  int64 total_row = 5;
  bool optimize_count_query = 6;
}