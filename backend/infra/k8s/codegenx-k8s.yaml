apiVersion: v1
kind: Namespace
metadata:
  name: codegenx
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: codegenx
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: codegenx/api-gateway:latest
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: codegenx-config
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: codegenx
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
    spec:
      containers:
        - name: user-service
          image: codegenx/user-service:latest
          ports:
            - containerPort: 8001
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-service
  namespace: codegenx
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-service
  template:
    metadata:
      labels:
        app: ai-service
    spec:
      containers:
        - name: ai-service
          image: codegenx/ai-service:latest
          ports:
            - containerPort: 8002
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: task-service
  namespace: codegenx
spec:
  replicas: 1
  selector:
    matchLabels:
      app: task-service
  template:
    metadata:
      labels:
        app: task-service
    spec:
      containers:
        - name: task-service
          image: codegenx/task-service:latest
          ports:
            - containerPort: 8004
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: codegenx
spec:
  type: ClusterIP
  selector:
    app: api-gateway
  ports:
    - port: 8000
      targetPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: codegenx
spec:
  type: ClusterIP
  selector:
    app: user-service
  ports:
    - port: 8001
      targetPort: 8001
---
apiVersion: v1
kind: Service
metadata:
  name: ai-service
  namespace: codegenx
spec:
  type: ClusterIP
  selector:
    app: ai-service
  ports:
    - port: 8002
      targetPort: 8002
---
apiVersion: v1
kind: Service
metadata:
  name: task-service
  namespace: codegenx
spec:
  type: ClusterIP
  selector:
    app: task-service
  ports:
    - port: 8004
      targetPort: 8004
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: codegenx-config
  namespace: codegenx
data:
  API_KEY: 'secret-api-key'
