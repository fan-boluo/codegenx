version: '3.9'

services:
  nginx:
    image: nginx:stable
    ports:
      - '80:80'
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api-gateway

  api-gateway:
    build: ./api-gateway
    ports:
      - '8000:8000'
    env_file:
      - .env
    depends_on:
      - user-service
      - ai-service
      - app-service
      - mysql
      - redis

  user-service:
    build: ./services/user-service
    ports:
      - '8001:8001'
    env_file:
      - .env

  ai-service:
    build: services/ai-service
    ports:
      - '8002:8002'
    env_file:
      - .env

  chat-service:
    build: ./services/app-service
    ports:
      - '8005:8005'
    env_file:
      - .env

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: codegenx
      MYSQL_USER: codegenx_user
      MYSQL_PASSWORD: codegenx_pass
    volumes:
      - mysql-data:/var/lib/mysql

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'

  prometheus:
    image: prom/prometheus:latest
    ports:
      - '9090:9090'
    volumes:
      - ./infra/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - api-gateway
      - user-service
      - ai-service
      - app-service

volumes:
  mysql-data:
